services:
  db:
    image: postgres:18-alpine
    container_name: datafy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # mismo puerto dentro y fuera: askly-postgres debe estar detenido
      - "${POSTGRES_PORT}:5432"
    volumes:
      # postgres 18+ monta la raiz y usa un subdirectorio por version mayor
      - datafy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datafy-pgdata:
